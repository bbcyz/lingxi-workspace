<aside class="workspace-account-rail workspace-account-index" aria-label="共享账号" data-workspace-account-table="{{ account_table }}"{% if account_view %} data-account-view="{{ account_view }}"{% endif %}>
  <div class="workspace-account-index-heading">
    <h2>共享账号 <span class="count-chip" data-account-count>—</span></h2>
    <button type="button" class="portal-quiet" data-account-window>账号管理</button>
  </div>
  <div class="workspace-account-list" data-account-links><p class="workspace-account-index-empty">正在读取账号…</p></div>
</aside>
<script src="/static/workspace-account-index.js" defer></script>
