name: Auto Sync Upstream

on:
  schedule:
    # 每天北京时间早晨 6:00 自动检查一次上游是否有更新
    - cron: '0 22 * * *'
  workflow_dispatch: # 也支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream
        uses: aormsby/Fork-Sync-With-Upstream@v3.4.1
        with:
          upstream_sync_repo: pppyl/lingxi-workspace
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false
