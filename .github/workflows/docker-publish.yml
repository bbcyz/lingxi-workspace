name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: lingxi-workspace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build x86_64 image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container startup & health
        env:
          IMAGE_TAG: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        run: |
          set -e
          cleanup() {
            docker rm -f lingxi-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name lingxi-smoke -p 5500:5500 "$IMAGE_TAG"

          READY=0
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' lingxi-smoke 2>/dev/null)" != "true" ]; then
              echo "容器启动失败，日志如下："
              docker logs lingxi-smoke
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5500/api/access/status >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "健康检查超时（60秒未就绪），日志如下："
            docker logs lingxi-smoke
            exit 1
          fi

          echo "健康检查接口响应："
          curl -fsS http://127.0.0.1:5500/api/access/status
          echo ""

          echo "验证 Linux 凭据存储模块..."
          docker exec lingxi-smoke python -c "
          from login_storage import DatabaseLoginStorage
          s = DatabaseLoginStorage('/tmp/smoke.sqlite3')
          s.save_credentials('smoke', '1', {'ok': True})
          assert s.load_credentials('smoke', '1') == {'ok': True}
          print('Linux storage smoke check passed!')
          "

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image to Docker Hub
        env:
          IMAGE_TAG: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        run: docker push "$IMAGE_TAG"
